title: "Noppera-bō"
tagline: "Physics · Mathematics · Machine Learning"
description: "Papers, projects, and notes on physics, mathematics, and machine learning."
author: "Noppera-bō"
url: "https://nopperab0.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

collections:
  articles:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: article

exclude:
  - README.md
  - HOW_TO_USE.md
  - Gemfile
  - Gemfile.lock
